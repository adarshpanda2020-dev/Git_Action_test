name: Gemini AI PR Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build review prompt with diff
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat .github/prompts/gemini-review.md
            echo ""
            echo "Here is the pull request diff to review:"
            echo '```diff'
            git diff origin/main...HEAD
            echo '```'
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          gcp_location: us-central1
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          use_vertex_ai: true
          gemini_model: gemini-2.5-flash
          prompt: ${{ steps.prompt.outputs.content }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: gemini-review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server and test endpoints
        run: |
          python main.py &
          SERVER_PID=$!
          sleep 3
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/health/detail
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/weather
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/forecast
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/forecast/summary
          kill $SERVER_PID
